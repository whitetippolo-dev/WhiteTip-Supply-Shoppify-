name: CI
on: [push]
jobs:
  lhci:
    name: Lighthouse
    runs-on: ubuntu-latest
    env:
      # Set in Settings > Secrets and variables > Actions (from a Shopify Dev Dashboard app
      # with read_products + write_themes). Lighthouse is skipped until both exist.
      SHOP_CLIENT_ID: ${{ secrets.SHOP_CLIENT_ID }}
      SHOP_CLIENT_SECRET: ${{ secrets.SHOP_CLIENT_SECRET }}
    steps:
      - name: Skip notice
        if: env.SHOP_CLIENT_ID == '' || env.SHOP_CLIENT_SECRET == ''
        run: echo "::notice::Lighthouse skipped - add SHOP_CLIENT_ID and SHOP_CLIENT_SECRET repository secrets to enable it."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SHOP_CLIENT_ID != '' && env.SHOP_CLIENT_SECRET != ''
      - name: Lighthouse
        if: env.SHOP_CLIENT_ID != '' && env.SHOP_CLIENT_SECRET != ''
        uses: shopify/lighthouse-ci-action@v1
        with:
          store: yyxvth-x7.myshopify.com
          client_id: ${{ env.SHOP_CLIENT_ID }}
          client_secret: ${{ env.SHOP_CLIENT_SECRET }}
          # Live theme (WhiteTip-Supply-Shoppify-/dev): test with its real settings and templates
          pull_theme: '198322028710'
          collection_handle: all
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
